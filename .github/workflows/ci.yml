name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/test.py
      - run: python scripts/knowledge.py --check
      - run: python -m platformio run --project-dir apps/calibrator_lb02a/bridge -e display-keypad-emulate
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: python firmware/scripts/build.py
      - run: python firmware/tests/run.py
        env:
          SANITIZE: '1'
      - run: python firmware/scripts/register_map.py --check
