[env:esp32-s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
monitor_speed = 115200

[env:display-capture]
extends = env:esp32-s3
build_flags = -DLCD_CAPTURE
monitor_speed = 4000000

; Enable only with TM1650 SDA isolated from the LB02A controller.
[env:display-keypad-emulate]
extends = env:display-capture
build_flags = ${env:display-capture.build_flags} -DKEYPAD_EMULATE
